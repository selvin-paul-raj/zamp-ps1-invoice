# docker compose up --build   ->  UI http://localhost:3000 , API http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zamp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      POSTGRES_DB: zamp_ps1
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zamp -d zamp_ps1"]
      interval: 3s
      retries: 20
    volumes: [pgdata:/var/lib/postgresql/data]

  api:
    build: ./backend
    environment:
      PGHOST: db
      PGUSER: zamp
      PGPASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      PGDATABASE: zamp_ps1
      PIPELINE_STEP_DELAY_MS: "350"
      CORS_ORIGINS: "http://localhost:3000"
      # DECISION_LLM_PROVIDER: ""   # optional explanation adapter, unset by default
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
